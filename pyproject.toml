[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-reference-robustness"
version = "0.1.0"
description = "Auditable scalp-EEG reference robustness and patient-independent preictal analysis"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Hassen Ouni"}, {name = "Lotfi Saidi"}]
dependencies = [
  "numpy>=1.24,<3", "scipy>=1.10,<2", "pandas>=2,<3",
  "scikit-learn>=1.3,<2", "mne>=1.6,<2", "matplotlib>=3.7,<4",
  "threadpoolctl>=3.1,<4"
]

[project.optional-dependencies]
dev = ["pytest>=7,<10", "build>=1,<2"]

[project.scripts]
eegref = "eegref.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[project.urls]
Repository = "https://github.com/hassenouni/eeg-reference-robustness"
Documentation = "https://github.com/hassenouni/eeg-reference-robustness/tree/main/docs"
Issues = "https://github.com/hassenouni/eeg-reference-robustness/issues"
